# ToolLedger web server. Replace https://api.example.com in connect-src with
# your Spring Boot origin (or serve the API from the same origin and use 'self').
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.example.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Never cache the entry points, so deployments take effect immediately.
  location = /index.html { add_header Cache-Control "no-store"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
  location = /flutter_bootstrap.js { add_header Cache-Control "no-cache"; }
  location = /version.json { add_header Cache-Control "no-store"; }

  # Single-page-app fallback for GoRouter deep links.
  location / { try_files $uri $uri/ /index.html; }
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
}
